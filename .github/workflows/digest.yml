name: Auction Digest

on:
  schedule:
    - cron: '0 14 * * *'  # Daily 2pm UTC = 4pm CEST
  workflow_dispatch:        # enables the "Run workflow" button

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Restore seen-lots state
        id: seen-cache
        uses: actions/cache/restore@v4
        with:
          path: seen_lots.json
          key: seen-lots-${{ github.run_id }}
          restore-keys: seen-lots-

      - name: Install dependencies
        run: uv sync

      - name: Install Playwright browsers
        run: uv run playwright install chromium --with-deps

      - name: Run auction-watch
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_RECIPIENT: ${{ secrets.DIGEST_RECIPIENT }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          # On first run (no cache) skip sending so the run only seeds the
          # seen-lots baseline. Next run will diff correctly.
          if [ ! -f seen_lots.json ]; then
            echo "No seen-lots cache — seeding baseline without sending email"
            unset RESEND_API_KEY
          fi
          uv run auction-watch

      - name: Save seen-lots state
        uses: actions/cache/save@v4
        if: always()
        with:
          path: seen_lots.json
          key: seen-lots-${{ github.run_id }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          publish_branch: gh-pages
