name: Auction Digest

on:
  schedule:
    - cron: '0 14 * * *'  # Daily 2pm UTC = 4pm CEST
  workflow_dispatch:        # enables the "Run workflow" button

jobs:
  digest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Install Playwright browsers
        run: uv run playwright install chromium --with-deps

      - name: Run auction-watch
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          DIGEST_RECIPIENT: ${{ secrets.DIGEST_RECIPIENT }}
        run: uv run auction-watch

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site
          publish_branch: gh-pages

      - name: Inject config.js into gh-pages
        env:
          TOKEN: ${{ secrets.ADD_ARTIST_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then echo "No ADD_ARTIST_TOKEN set, skipping"; exit 0; fi
          ENCODED=$(printf '%s' "$TOKEN" | base64 -w 0)
          git fetch origin gh-pages
          git checkout gh-pages
          printf "var GH_TOKEN = atob('%s');\n" "$ENCODED" > config.js
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config.js
          git diff --cached --quiet || git commit -m "chore: update config [skip ci]"
          git push origin gh-pages
