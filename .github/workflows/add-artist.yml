name: Add Artist

on:
  workflow_dispatch:
    inputs:
      artist_name:
        description: 'Artist name (e.g. "Cindy Sherman")'
        required: true
        type: string

jobs:
  add-artist:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Add artist
        run: uv run auction-watch-add "${{ github.event.inputs.artist_name }}"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet artists.yml || (
            git add artists.yml &&
            git commit -m "Add artist: ${{ github.event.inputs.artist_name }}" &&
            git push
          )
